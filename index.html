<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Senha</title>
    <link rel="icon" type="image/x-icon" href="assets/key.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/index.css">
    <script src="scripts/jquery.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="py-4 text-center">
        <h1 class="display-5 fw-bold text-white">Sua Senha</h1>
    </header>

    <main id="app-content" class="flex-grow-1 d-flex justify-content-center px-3 gap-3">
        <article class="card-action p-4 p-md-5 shadow-lg">
            <h2 class="fw-bold text-white text-center">Gere</h2>
            <div class="row justify-content-center">
                <section id="password-display" class="password-box mb-3 text-center" title="Clique para copiar">
                    <span id="password-text">Clique em gerar</span>
                </section>

                <form action="" id="generator-form" class="card-generator p-4 shadow-lg mb-4">
                    <button type="submit" class="btn btn-gerar w-100 fw-bold mb-4">GERAR</button>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <label for="password-len" class="form-label text-white-50">Tamanho</label>
                            <span id="len-value" class="fw-bold">12</span>
                        </div>
                        <input type="range" class="form-range" min="5" max="30" value="12" id="password-len">
                    </div>

                    <div class="options-grid">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="lowercase-input" checked>
                            <label class="form-check-label" for="lowercase-input">Letras minúsculas</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="uppercase-input" checked>
                            <label class="form-check-label" for="uppercase-input">Letras maiúsculas</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="numbers-input" checked>
                            <label class="form-check-label" for="numbers-input">Números</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="symbols-input">
                            <label class="form-check-label" for="symbols-input">Símbolos</label>
                        </div>
                    </div>
                </form>

                <section class="info-card p-4 text-center">
                    <h6 class="text-white-50 mb-2">Estimativa de segurança</h6>
                    <div id="brute-force-result" class="fw-bold">—</div>
                </section>
            </div>
        </article>

        <article class="card-action p-4 p-md-5 shadow-lg">
            <h2 class="fw-bold text-white text-center">Avalie</h2>
            <section id="user-input" class="mb-4">
                <label for="password-field" class="form-label mb-3 text-center w-100">Digite sua "obra de arte"</label>
                <div class="input-group">
                    <input type="password" id="password-field" class="form-control form-control-lg shadow-none"
                        placeholder="Sua senha aqui...">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                        <span id="eye-icon">👁️</span>
                    </button>
                </div>
            </section>

            <section id="password-analysis-result" class="text-center">
                <div class="feedback-container d-flex align-items-center justify-content-center p-3" aria-live="polite">
                    <span id="result" class="feedback-text">Ainda não escreveu nada? Ótimo.</span>
                </div>
                <div class="text-center mb-3">
                    <img id="status-character" src="assets/score-0.jpeg" alt="Mascote" style="height: 150px;">
                </div>
            </section>

        </article>
    </main>

    
    <footer class="py-3 text-center position-relative">
        <div class="toast-container position-absolute bottom-100 start-50 translate-middle-x pb-2">
            <div id="copy-toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body text-center w-100">Copiado com sucesso!</div>
                </div>
            </div>
        </div>
        <small class="txt-muted">
            Desenvolvido por 
            <a class="dev-link" href="https://www.linkedin.com/in/jorder-gomes-645636186/" target="_blank" rel="noopener noreferrer">
                Jorder Gomes
            </a>
        </small>
    </footer> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/d49239e0c9.js" crossorigin="anonymous"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/app.js"></script>
</body>

</html>
