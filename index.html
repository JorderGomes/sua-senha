<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssaSenha? | Analisador Sarcástico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/index.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="py-4 text-center">
        <h1 class="display-5 fw-bold text-white">Essa Senha?</h1>
    </header>

    <main class="flex-grow-1 d-flex justify-content-center px-3">
        <article class="card-analisador p-4 p-md-5 shadow-lg">

            <section id="user-input" class="mb-4">
                <label for="password-field" class="form-label mb-3">Digite sua "obra de arte":</label>
                <div class="input-group">
                    <input type="password" id="password-field" class="form-control form-control-lg shadow-none"
                        placeholder="Sua senha aqui...">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                        <span id="eye-icon">👁️</span>
                    </button>
                </div>
            </section>

            <section id="password-analysis-result" class="text-center">
                <div class="feedback-container d-flex align-items-center justify-content-center p-3" aria-live="polite">
                    <span id="result" class="feedback-text">Ainda não escreveu nada? Ótimo.</span>
                </div>
                <div class="text-center mb-3">
                    <img id="status-character" src="assets/score-0.jpeg" alt="Mascote" style="height: 150px;">
                </div>
            </section>

        </article>
    </main>

    <footer class="py-3 text-center">
        <small class="text-muted">Feito com desdém por um Analisador Passivo-Agressivo.</small>
    </footer>

    <a href="https://forms.gle/yUvHxWkzHZfaAtZV6" target="_blank" class="feedback-link">
        <i class="fa-solid fa-message"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/d49239e0c9.js" crossorigin="anonymous"></script>
    <script src="scripts/main.js"></script>
</body>

</html>
